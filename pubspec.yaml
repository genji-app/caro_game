name: co_caro_flame
description: Cờ Caro game using Flutter Flame engine - Full Featured
publish_to: 'none'
version: 1.0.8+6

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Caro game
  flame: ^1.18.0
  flutter_animate: ^4.5.0
  terminate_restart: ^1.1.0
  package_info_plus: ^8.0.3
  shorebird_code_push: ^2.0.5
  unlock_shorebird_kit:
    path: packages/unlock_shorebird_kit

  # Share sheet (export result + board snapshot as image)
  share_plus: ^10.1.2
  google_fonts: ^6.2.1
  audioplayers: ^6.5.1
  rive: ^0.14.1
  url_launcher: ^6.2.5

  sun_sports:
    path: packages/sun_sports_package
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.3
  build_runner: ^2.10.1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.12.0
  isolate_manager_generator: ^0.3.0

# path_provider_foundation 2.6+ bundles package:objective_c (native_assets). A bad
# device/simulator cache mix can produce an arm64 slice marked IOSSIMULATOR and
# App Store rejects the IPA (code 91169). 2.4.x uses classic federated iOS code
# without that framework — safe for store until upstream fixes are verified.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A3E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_channel_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - shorebird.yaml
