name: caxilo_repository
description: A repository that manages game data with in-memory caching and reactive updates.
version: 2.0.0
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.0.0
  game_api_client:
    path: ../game_api_client
  caxilo_config:
    path: ../caxilo_config

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
